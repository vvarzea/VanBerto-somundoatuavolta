:root{--ink:#1e1b4b;--sun:#ffd23f;--coral:#ff6b6b;--mint:#2ee6a6;--sky:#4cc9f0;--grape:#7c3aed;--cream:#fff8e7;--gold:#FFD600;}
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent;}
html{background:var(--cream);}
body{
  min-height:100vh;min-height:100dvh;display:flex;padding:clamp(10px,3vw,24px);
  font-family:'Nunito',system-ui,sans-serif;color:var(--ink);
  background-color:var(--cream);
  background-image:radial-gradient(rgba(255,150,60,.30) 1.4px,transparent 1.6px);background-size:22px 22px;
}
@keyframes rise{from{opacity:0;transform:translateY(16px) scale(.97)}to{opacity:1;transform:none}}
@keyframes drive{0%{left:102%}100%{left:-34%}}
@keyframes puff{0%{opacity:.7;transform:translate(0,0) scale(.5)}100%{opacity:0;transform:translate(14px,-22px) scale(1.4)}}
@keyframes vbFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
@keyframes vbBubbleIn{0%{opacity:0;transform:scale(.6) translateY(6px)}60%{opacity:1;transform:scale(1.08) translateY(-2px)}100%{opacity:1;transform:scale(1) translateY(0)}}

.wrap{position:relative;z-index:1;width:min(660px,100%);margin:auto;}
@media(min-width:700px){.wrap{width:min(860px,100%);}}
.card{background:#fff;border:3px solid var(--ink);border-radius:28px;overflow:hidden;box-shadow:0 6px 0 var(--ink);}

/* ── HERO ── */
.hero{text-align:center;padding:clamp(16px,4vw,24px) clamp(14px,4vw,28px) clamp(12px,3vw,18px);
  background:linear-gradient(#fff,var(--cream));border-bottom:3px solid var(--ink);}
.hero-icon{display:block;width:clamp(68px,17vw,88px);height:clamp(68px,17vw,88px);margin:0 auto 8px;object-fit:cover;background:#16204a;border:3px solid var(--ink);border-radius:22%;box-shadow:0 4px 0 var(--ink);}
.title{font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(26px,7vw,42px);color:var(--ink);line-height:1.1;}
.sub{margin-top:4px;color:var(--grape);font-size:clamp(10px,2.6vw,13px);font-weight:900;letter-spacing:1.2px;text-transform:uppercase;}
.hero-stats{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;margin-top:10px;}
.stat-badge{display:inline-flex;align-items:center;gap:4px;padding:2px 12px;border-radius:20px;white-space:nowrap;
  font-family:'Fredoka One',cursive;font-size:clamp(11px,3vw,13px);color:var(--ink);background:var(--sun);border:2px solid var(--ink);box-shadow:0 2px 0 var(--ink);}
.stat-badge:nth-child(2){background:var(--mint);}
.stat-badge:nth-child(3){background:var(--sky);}
.stat-badge:nth-child(4){background:#ffb3b3;}
/* continuar */
.resume{display:none;margin:14px auto 0;max-width:420px;align-items:center;justify-content:center;gap:10px;text-decoration:none;color:var(--ink);
  font-family:'Fredoka One',cursive;font-size:clamp(14px,4vw,17px);padding:10px 22px;border-radius:50px;
  background:var(--sun);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.resume.on{display:flex;}
.resume:hover{transform:translateY(-2px);box-shadow:0 6px 0 var(--ink);}
.resume:active{transform:translateY(3px);box-shadow:0 1px 0 var(--ink);}
.resume:focus-visible{outline:3px solid var(--grape);outline-offset:3px;}
.resume small{font-family:'Nunito',sans-serif;font-weight:900;font-size:.68em;letter-spacing:.8px;text-transform:uppercase;opacity:.8;}

/* ── JOGOS ── */
.games{padding:clamp(14px,3vw,20px) clamp(12px,3vw,20px) clamp(16px,3vw,22px);}
.games-label{display:flex;align-items:center;gap:10px;font-family:'Fredoka One',cursive;font-weight:400;color:var(--ink);font-size:clamp(12px,3vw,14px);letter-spacing:1.4px;text-transform:uppercase;margin-bottom:14px;}
.games-label::before,.games-label::after{content:'';flex:1;border-top:3px dotted rgba(30,27,75,.28);}
.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;}
@media(max-width:560px){.grid{grid-template-columns:repeat(2,1fr);}}
@media(max-height:480px) and (orientation:landscape){.grid{grid-template-columns:repeat(4,1fr);}}

/* ── GRUPOS (como no Pensamento Computacional) ── */
.grp{grid-column:1/-1;display:flex;align-items:center;gap:10px;width:100%;margin:10px 0 2px;padding:10px 18px;cursor:pointer;user-select:none;text-align:left;
  font-family:'Fredoka One',cursive;font-weight:400;font-size:clamp(17px,4.6vw,22px);color:var(--ink);background:var(--gc,#ffd23f);
  border:3px solid var(--ink);border-radius:20px;box-shadow:0 5px 0 var(--ink);transition:transform .08s,box-shadow .08s;}
.grp:first-child{margin-top:0;}
.grp:hover{filter:brightness(1.04);}
.grp:active{transform:translateY(4px);box-shadow:0 1px 0 var(--ink);}
.grp:focus-visible{outline:4px solid var(--grape);outline-offset:3px;}

 const a=nz(i.a),ot=i.o.map(x=>nz(x[0])).filter(x=>x!==a);let k=1;while(k<=a.length&&ot.some(x=>x.startsWith(a.slice(0,k))))k++;
 if(k===1)return i;const og=String(i.a);
 if(k<=a.length)i.hint='Dica: o nome começa por '+og.slice(0,k).toUpperCase().trim()+'… 💡';
 else i.hint='Dica: o nome começa pela letra '+og[0].toUpperCase()+' e tem '+a.replace(/[^a-z]/g,'').length+' letras. 💡';
 return i;}
const cap=s=>s[0].toUpperCase()+s.slice(1);
const tk=(L,m)=>sh(L).slice(0,m);
const mkI=a=>a.map(([n,e,ar,g])=>({n,e,a:ar,g}));
const hnt=it=>it.hi?'Dica: pensa '+it.hi+'! 💡':'Dica: o nome começa pela letra '+it.n[0].toUpperCase()+'. 💡';
const okm=it=>(it.ok||'É '+it.a+' '+it.n+'!')+' '+pick(OK);
const opts=(L,it,n)=>sh([it,...sh(L.filter(x=>x!==it&&!(it.g&&x.g===it.g))).slice(0,n-1)]);
const pic=x=>x.svg?'<span class="em sv">'+x.svg+'</span>':'<span class="em">'+ei(x.e)+'</span>';
const LAB={
 e:x=>pic(x)+'<span class="vh">'+x.n+'</span>',
 en:x=>pic(x)+'<span class="lb">'+cap(x.n)+'</span>',
 n:x=>'<span class="lb">'+cap(x.n)+'</span>',
 sw:x=>'<i class="sw'+(x.dk?' dk':'')+'" style="--sw:'+x.col+'">'+x.n.toUpperCase()+'</i>'};
const QR=(t,c,bg,ins,items)=>({quiz:1,t,c,bg,ins,items:Array.isArray(items)?items.map(fixH):items});
const qFind=(L,n,lab)=>it=>({t:it.p||'Procura '+it.a+' '+it.n+'. 🔎',v:'<div class="word">'+(it.w||it.n).toUpperCase()+'</div>',o:opts(L,it,n).map(x=>[x.n,LAB[lab](x)]),a:it.n,hint:hnt(it),ok:okm(it)});
const emv=x=>'<div class="bigem">'+(x.svg||ei(x.e))+'</div>',dotv=x=>'<div class="cdot" style="background:'+x.col+'"></div>';
const qRead=(L,n,q,vf)=>it=>({t:q,v:(vf||emv)(it),o:opts(L,it,n).map(x=>[x.n,LAB.n(x)]),a:it.n,hint:hnt(it),ok:okm(it)});
const qAsk=(L,n,lab)=>([p,nm])=>{const it=L.find(x=>x.n==nm);return{t:p,v:'',o:opts(L,it,n).map(x=>[x.n,LAB[lab](x)]),a:nm,hint:hnt(it),ok:okm(it)};};

 const f=s=='facil',lab=f?o.lf:o.lc,no=f?3:4,

let B={},snd=true,G,S,RS,ri,ST,R,err,hn,done,sel=null,drag=null,mood=null,ft,AC;
let O={guide:false,calm:false,big:false};
try{B=JSON.parse(localStorage.getItem('vbm')||'{}');snd=localStorage.getItem('vbs')!=='0';O=Object.assign(O,JSON.parse(localStorage.getItem('vbo')||'{}'));}catch(e){}
const applyO=()=>{['calm','big'].forEach(k=>document.body.classList.toggle(k,!!O[k]));};applyO();
const P=$('#play'),H=$('#hub'),M=$('#modal');
function beep(f,d,t){if(!snd)return;try{AC=AC||new(window.AudioContext||window.webkitAudioContext)();const o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(.001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function face(m){mood=m||null;const c=$('#vbCv').getContext('2d');c.clearRect(0,0,288,288);c.drawImage(vbFrame(m||false,-1,m==='happy'),0,0);clearTimeout(ft);if(m)ft=setTimeout(()=>face(),2400);}
let bt;function say(t){if(!snd)return;try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(t.replace(/[^\p{L}\p{N}\s.,!?]/gu,''));u.lang='pt-PT';u.rate=.9;try{const v=speechSynthesis.getVoices().find(x=>/^pt[-_]PT/i.test(x.lang));if(v)u.voice=v;}catch(e){}speechSynthesis.speak(u);}catch(e){}}
function vb(m,f){document.body.classList.toggle('playing',!P.hidden);const b=$('#vbMsg');b.textContent=m;b.classList.remove('hide','pop');void b.offsetWidth;b.classList.add('pop');clearTimeout(bt);if(!P.hidden)bt=setTimeout(()=>b.classList.add('hide'),5200);face(f);say(m);}
function fx(){if(O.calm)return;for(let i=0;i<26;i++){const s=document.createElement('i');s.className='cf';s.textContent=pick(['⭐','🎉','✨','🎈','💛']);s.style.cssText='left:'+Math.random()*100+'vw;animation-delay:'+Math.random()*.6+'s';document.body.append(s);setTimeout(()=>s.remove(),2900);}}
function modal(h){M.innerHTML='<div class="mbox">'+h+'</div>';M.hidden=false;}
function dock(){}
function cnt(){const e=$('#cnt');if(e)e.textContent=' · '+done+'/'+R.items.length;}
let st;function setCur(){P.querySelectorAll('.c.cur').forEach(x=>x.classList.remove('cur','sel'));const c=P.querySelector('.c:not(.used)');if(c){c.classList.add('cur','sel');sel=c;clearTimeout(st);st=setTimeout(()=>{if(sel===c)say(nm(c));},done?2800:1600);}}
const GROUPS=[
 {e:'🏠',n:'Eu e o Meu Dia a Dia',c:'#ffd23f',t:['dia','rot','tar','rou','emo']},
 {e:'🍎',n:'Saúde e Alimentação',c:'#ff9aa2',t:['den','hig','ali','com','fru','leg']},
 {e:'🌳',n:'Natureza e Animais',c:'#2ee6a6',t:['dom','sel','viv','pla','rec']},
 {e:'🕒',n:'Tempo, Números e Cores',c:'#4cc9f0',t:['hor','sem','est','tem','con','mai','cor']},
 {e:'🚦',n:'Cidade e Segurança',c:'#c4b5fd',t:['rua','tra','pro']}];
let OPEN=0;try{const v=localStorage.getItem('vbm_g');if(v!==null&&+v>=-1&&+v<GROUPS.length)OPEN=+v;}catch(e){}
function togG(l){const k=+l.dataset.k;OPEN=OPEN===k?-1:k;try{localStorage.setItem('vbm_g',OPEN);}catch(e){}
 document.querySelectorAll('#grid .grp').forEach(x=>x.setAttribute('aria-expanded',+x.dataset.k===OPEN));
 document.querySelectorAll('#grid .game').forEach(x=>x.classList.toggle('gh',+x.dataset.g!==OPEN));
 if(OPEN===k)setTimeout(()=>{try{l.scrollIntoView({block:'start',behavior:O.calm?'auto':'smooth'});}catch(e){}},60);}
let NAME='',LASTG=null,ASKED=0;
try{NAME=localStorage.getItem('vbmn')||'';LASTG=JSON.parse(localStorage.getItem('vbml')||'null');}catch(e){}
const esc=v=>String(v).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function paintTop(){$('#who').textContent=NAME?'👤 '+NAME:'👤 Escrever o meu nome';
 const r=$('#resume'),g=LASTG&&GAMES.find(x=>x.k===LASTG.k);
 if(g){r.innerHTML=g.e+' Continuar: '+g.n+' <small>onde ficaste</small>';r.classList.add('on');}else r.classList.remove('on');}
function nameModal(){ASKED=1;modal('<h2>👋 Como te chamas?</h2><p>Escreve o teu nome para o VanBerto\'s te cumprimentar.</p><input id="nmi" maxlength="30" placeholder="O teu nome" value="'+esc(NAME)+'" style="font:inherit;font-size:20px;padding:10px 14px;border:3px solid var(--ink);border-radius:16px;width:100%;box-sizing:border-box;text-align:center"><div class="opts"><button class="btn big" id="nmok">✔️ Continuar</button><button class="btn big" id="nmsk" style="background:#fff">Agora não</button></div>');setTimeout(()=>{const i=$('#nmi');i&&i.focus();},50);}
function okName(){const v=$('#nmi').value.trim();if(!v){$('#nmi').focus();return;}NAME=v;try{localStorage.setItem('vbmn',v);}catch(e){}M.hidden=true;paintTop();if(!H.hidden)vb('Olá, '+NAME+'! Escolhe um jogo! 🎮');}
function saveLast(g,sub){LASTG={k:g.k,s:sub||null};const gi=GROUPS.findIndex(x=>x.t.includes(g.k));if(gi>=0)OPEN=gi;try{localStorage.setItem('vbml',JSON.stringify(LASTG));localStorage.setItem('vbm_g',OPEN);}catch(e){}}
function hub(){dock(0);M.hidden=true;P.hidden=true;H.hidden=false;try{speechSynthesis.cancel();}catch(e){}
 const CARDS=GAMES.map((g,i)=>{const b=B[g.k];return`<div class="game" role="button" tabindex="0" data-i="${i}" style="--gc:${g.c};--i:${i}"><div class="bubble">${g.e}</div><div class="name">${g.n}</div><div class="desc">${g.d}</div>${b?`<div class="prog"><div class="prog-bar"><i style="width:${b.s/b.m*100}%"></i></div><div class="prog-txt${b.s>=b.m?' done':''}">⭐ ${b.s}/${b.m}</div></div>`:''}<div class="play">▶ Jogar</div></div>`});
 $('#grid').innerHTML=GROUPS.map((g,k)=>{const ix=GAMES.map((x,i)=>i).filter(i=>g.t.includes(GAMES[i].k)),open=OPEN===k,done=ix.filter(i=>B[GAMES[i].k]).length;
  return '<div class="grp" role="button" tabindex="0" data-k="'+k+'" aria-expanded="'+open+'" style="--gc:'+g.c+'"><span class="gi">'+g.e+'</span><span class="gt">'+g.n+'</span><span class="gn">⭐ '+done+'/'+ix.length+'</span></div>'+ix.map(i=>CARDS[i].replace('class="game"','class="game'+(open?'':' gh')+'" data-g="'+k+'"')).join('');}).join('');
 vb(NAME?'Olá, '+NAME+'! Escolhe um jogo! 🎮':'Olá! Escolhe um jogo! 🎮');paintTop();if(!NAME&&!ASKED)nameModal();}
function choose(g){dock(0);G=g;H.hidden=true;P.hidden=false;P.style.setProperty('--pb','#fff');P.innerHTML='<div class="bar"><button class="btn" id="bk">←</button><div class="ttl">'+g.e+' '+g.n+'</div></div><div id="say"></div><div class="pbody"><p class="ins">Escolhe como queres jogar:</p><div class="opts">'+g.subs.map(([k,l])=>'<button class="btn big" data-s="'+k+'">'+l+'</button>').join('')+'</div></div>';dock(1);vb('Como queres jogar? 🤔');}
function start(g,s){G=g;S=s;saveLast(g,s);RS=g.rounds(s);ri=0;ST=[];H.hidden=true;P.hidden=false;round();}
function round(){dock(0);R=RS[ri];err=hn=done=0;sel=null;M.hidden=true;let pool=sh(R.items);if(!R.sort&&pool.every((x,i)=>x===R.items[i]))pool.reverse();
 P.style.setProperty('--pc',R.c);P.style.setProperty('--pb',R.bg);
 if(R.quiz){qi=0;P.innerHTML='<div class="bar"><button class="btn" id="bk">←</button><div class="ttl">'+R.t+'</div><button class="btn" id="hi">💡</button><button class="btn" id="mu">'+(snd?'🔊':'🔇')+'</button></div><div class="pips">'+RS.map((_,i)=>'<i class="pip '+(i<ri?'ok':i==ri?'on':'')+'"></i>').join('')+'</div><div id="say"></div><div class="pbody"><p class="ins">'+R.ins+'<span id="cnt"></span></p><div id="qb"></div></div>';dock(1);cnt();scrollTo(0,0);qshow();return;}
 P.innerHTML='<div class="bar"><button class="btn" id="bk">←</button><div class="ttl">'+R.t+'</div><button class="btn" id="hi">💡</button><button class="btn" id="mu">'+(snd?'🔊':'🔇')+'</button></div><div class="pips">'+RS.map((_,i)=>'<i class="pip '+(i<ri?'ok':i==ri?'on':'')+'"></i>').join('')+'</div><div id="say"></div><div class="pbody"><p class="ins">'+(R.sort?'Toca no sítio certo para a carta. Também podes arrastar!':'Põe as cartas no número certo. Toca na carta e no número, ou arrasta!')+'<span id="cnt"></span></p><div class="slots'+(R.sort?' bins':'')+'"'+(R.sort&&R.bins.length<4?' style="grid-template-columns:repeat('+R.bins.length+',1fr)"':'')+'>'+(R.sort?R.bins.map(b=>'<div class="s bin" tabindex="0" data-b="'+b.k+'" style="--bc:'+b.c+'"><span class="ic">'+b.e+'</span><span>'+b.n+'</span><em>0</em></div>').join(''):R.items.map((_,i)=>'<div class="s" tabindex="0" data-i="'+i+'"><b>'+(i+1)+'</b></div>').join(''))+'</div><div class="cards'+(R.sort?' one':'')+'" id="pool">'+pool.map(c=>'<div class="c" tabindex="0" role="button" data-id="'+c.id+'">'+'<div class="im">'+c.h+'</div><span>'+c.n+'</span></div>').join('')+'</div></div>';
 dock(1);if(R.sort)setCur();cnt();guide();
 scrollTo(0,0);vb(R.q||'Qual é a ordem certa? 🤔');}
function nm(c){return c.querySelector('span').textContent;}
function pickc(c){say(nm(c));if(sel===c){if(R.sort)return;c.classList.remove('sel');sel=null;return;}sel&&sel.classList.remove('sel');sel=c;c.classList.add('sel');vb('Agora toca no sítio certo! 👆');}
function shake(e){if(O.calm)return;e.classList.remove('shake');void e.offsetWidth;e.classList.add('shake');}
function drop(c,s){const it=R.items.find(x=>x.id==c.dataset.id);
 const ok=R.sort?it.s==s.dataset.b:R.items.indexOf(it)==+s.dataset.i&&!s.classList.contains('done');
 sel&&sel.classList.remove('sel');sel=null;
 if(!ok){if(!O.guide)err++;shake(s);shake(c);beep(330,.35);vb(O.guide?'Vamos pôr aqui! 👉':pick(R.err||ERR));return;}
 c.classList.add('used');done++;beep(660,.15);vb(it.f||pick(R.ok||OK),'happy');
 if(R.sort){const e=s.querySelector('em');e.textContent=+e.textContent+1;}else{s.classList.add('done');s.innerHTML='<div class="c in">'+c.innerHTML+'</div>';}
 cnt();if(R.sort&&done<R.items.length)setCur();guide();if(done==R.items.length)setTimeout(finish,1100);}
function target(){let c,s;if(R.sort){c=P.querySelector('.c:not(.used)');s=c&&P.querySelector('[data-b="'+R.items.find(x=>x.id==c.dataset.id).s+'"]');}else{s=P.querySelector('.s:not(.done)');c=s&&P.querySelector('.c[data-id="'+R.items[+s.dataset.i].id+'"]');}return[c,s];}
function guide(){P.querySelectorAll('.hintc,.hint').forEach(x=>x.classList.remove('hintc','hint'));if(!O.guide||done==R.items.length)return;const[c,s]=target();c&&c.classList.add('hintc');s&&s.classList.add('hint');}
function hint(){if(done==R.items.length)return;hn++;let c,s;
 if(R.sort){c=P.querySelector('.c:not(.used)');s=P.querySelector('[data-b="'+R.items.find(x=>x.id==c.dataset.id).s+'"]');}
 else{s=P.querySelector('.s:not(.done)');c=P.querySelector('.c[data-id="'+R.items[+s.dataset.i].id+'"]');}
 c.classList.add('hintc');s.classList.add('hint');vb('Olha para aqui! 💡');setTimeout(()=>{c.classList.remove('hintc');s.classList.remove('hint');},3200);}
function finish(){const s=O.guide||err==0&&!hn?3:err<=2&&!hn?2:1;ST[ri]=s;fx();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>beep(f,.25),i*130));const last=ri==RS.length-1;
 vb(s==3?'Perfeito! Três estrelas! 🌟':'Muito bem! Continua! 🎉','happy');
 modal('<h2>'+'⭐'.repeat(s)+'☆'.repeat(3-s)+'</h2><p>'+(err?err+' erro(s) — ':'Sem erros! ')+R.t+' completo!</p>'+(R.sort||R.quiz?'':'<div class="rc">'+R.items.map((x,i)=>'<span>'+(i+1)+'. '+x.n+'</span>').join('')+'</div>')+'<button class="btn big" id="nx">'+(last?'Ver resultado 🏆':'Seguinte ▶')+'</button>');}
function end(){const t=ST.reduce((a,b)=>a+b,0),m=RS.length*3,o=B[G.k];if(!o||t/m>=o.s/o.m)B[G.k]={s:t,m};try{localStorage.setItem('vbm',JSON.stringify(B));}catch(e){}
 fx();vb('Que campeão! 🏆','happy');modal('<h2>🏆</h2><p>Ganhaste ⭐ '+t+' de '+m+' estrelas!</p><button class="btn big" id="ag">Jogar outra vez</button> <button class="btn big" id="mn">Menu</button>');}
function cfgModal(){const T=[['snd','🗣️ Ler em voz alta',snd],['guide','🧩 Ajuda automática (sem erros)',O.guide],['calm','🌿 Modo calmo (sem confetes nem abanões)',O.calm],['big','🔠 Letras e imagens maiores',O.big]];modal('<h2 style="font-size:30px">⚙️ Ajudas</h2><p>O professor escolhe o que ajuda o aluno.</p><div class="opts">'+T.map(([k,l,v])=>'<button class="btn big" data-o="'+k+'" aria-pressed="'+v+'" style="width:100%;'+(v?'':'background:#fff')+'">'+(v?'✅ ':'⬜ ')+l+'</button>').join('')+'<button class="btn big" id="mn">Fechar</button></div>');}
$('#cfg').addEventListener('click',cfgModal);
M.addEventListener('click',e=>{const t=e.target;const o=t.closest('[data-o]');if(o){const k=o.dataset.o;if(k=='snd'){snd=!snd;try{localStorage.setItem('vbs',snd?'1':'0');}catch(x){}}else{O[k]=!O[k];try{localStorage.setItem('vbo',JSON.stringify(O));}catch(x){}applyO();}cfgModal();return;}if(t.id=='nx'){ri++;ri<RS.length?round():0;if(ri>=RS.length){ri--;end();}}if(t.id=='ag')G.subs&&!S?choose(G):start(G,S);if(t.id=='mn')hub();});
P.addEventListener('click',e=>{const t=e.target;if(t.closest('#bk'))return hub();
 if(t.closest('#mu')){snd=!snd;try{localStorage.setItem('vbs',snd?'1':'0');}catch(x){}t.closest('#mu').textContent=snd?'🔊':'🔇';return;}
 if(t.closest('#hi'))return P.querySelector('#qb')?qhint():hint();if(P.querySelector('#qb')){const a=t.closest('.qo'),j=t.closest('.qobj');if(a)return qans(a);if(j)return qcount(j);return;}const o=t.closest('[data-s]');if(o)return start(G,o.dataset.s);const s=t.closest('.s');if(s&&sel)drop(sel,s);});
P.addEventListener('keydown',e=>{if(e.key!=='Enter'&&e.key!==' ')return;const qj=e.target.closest('.qobj');if(qj){e.preventDefault();qcount(qj);return;}const c=e.target.closest('.c'),s=e.target.closest('.s');if(c&&!c.classList.contains('used')){e.preventDefault();pickc(c);}else if(s&&sel){e.preventDefault();drop(sel,s);}});
P.addEventListener('pointerdown',e=>{const c=e.target.closest('#pool .c');if(c&&!c.classList.contains('used'))drag={c,x:e.clientX,y:e.clientY,m:0};});
addEventListener('pointermove',e=>{if(!drag)return;if(!drag.m&&Math.hypot(e.clientX-drag.x,e.clientY-drag.y)>8){drag.m=1;drag.g=drag.c.cloneNode(true);drag.g.className='c ghost';document.body.append(drag.g);}if(drag.m){drag.g.style.left=e.clientX-52+'px';drag.g.style.top=e.clientY-60+'px';}});
addEventListener('pointerup',e=>{if(!drag)return;const d=drag;drag=null;if(d.m){d.g.remove();const t=document.elementFromPoint(e.clientX,e.clientY),s=t&&t.closest('.s');if(s)drop(d.c,s);}else pickc(d.c);});
addEventListener('pointercancel',()=>{if(drag&&drag.g)drag.g.remove();drag=null;});
$('#who').addEventListener('click',nameModal);
$('#resume').addEventListener('click',()=>{const g=LASTG&&GAMES.find(x=>x.k===LASTG.k);if(!g)return;g.subs?start(g,LASTG.s||g.subs[0][0]):start(g);});
M.addEventListener('click',e=>{const t=e.target;if(t.closest('#nmok'))return okName();if(t.closest('#nmsk')){M.hidden=true;}});
M.addEventListener('keydown',e=>{if(e.key==='Enter'&&e.target.id==='nmi')okName();});
const pg=e=>{const l=e.target.closest('.grp');if(l)return togG(l);const g=e.target.closest('.game');if(!g)return;const x=GAMES[+g.dataset.i];x.subs?choose(x):start(x);};
$('#grid').addEventListener('click',pg);$('#grid').addEventListener('keydown',e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();pg(e);}});
setInterval(()=>{if(!mood){face(true);setTimeout(()=>{if(!mood)face();},150);}},4200);
document.fonts.ready.then(()=>{hub();face();});
if('serviceWorker' in navigator)addEventListener('load',()=>navigator.serviceWorker.register('sw.js').catch(()=>{}));

</script>
